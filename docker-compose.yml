services:
  mongodb:
    image: mongo:7.0
    container_name: notificationhub-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: notification_hub
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: notificationhub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  mongo_data:
